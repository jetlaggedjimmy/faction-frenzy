<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Faction Frenzy - Overlay Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alfa+Slab+One&family=Bangers&family=Barriecito&family=Bebas+Neue&family=Crafty+Girls&family=Damion&family=DynaPuff:wght@400..700&family=Fascinate&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Limelight&family=Lobster&family=Luckiest+Guy&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Monoton&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Orbitron:wght@400..900&family=Pacifico&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poetsen+One&family=Press+Start+2P&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik+Wet+Paint&family=Syncopate:wght@400;700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <style>
    h2, h3, h4, legend {
      color: #fc8911;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .font-merriweather {
      font-family: "Merriweather", serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
      font-variation-settings:
        "wdth" 100;
    }

    .font-roboto {
      font-family: "Roboto", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
      font-variation-settings:
        "wdth" 100;
    }

    .font-inter {
      font-family: "Inter", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
    }

    .font-playfair-display {
      font-family: "Playfair Display", serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
    }

    .font-open-sans {
      font-family: "Open Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
      font-variation-settings:
        "wdth" 100;
    }

    .font-lobster {
      font-family: "Lobster", sans-serif;
      font-weight: 400;
      font-style: normal;
    }

    .font-bebas-neue {
      font-family: "Bebas Neue", sans-serif;
      font-weight: 400;
      font-style: normal;
    }

    .font-ubuntu {
      font-family: "Ubuntu", sans-serif;
      font-weight: 400;
      font-style: normal;
    }

    .font-abril-fatface {
      font-family: "Abril Fatface", serif;
      font-weight: 400;
      font-style: normal;
    }

    .font-alfa-slab-one {
      font-family: "Alfa Slab One", serif;
      font-weight: 400;
      font-style: normal;
    }

    .font-barriecito {
      font-family: "Barriecito", system-ui;
      font-weight: 400;
      font-style: normal;
    }

    .font-bangers {
      font-family: "Bangers", system-ui;
      font-weight: 400;
      font-style: normal;
    }

    .font-luckiest-guy {
      font-family: "Luckiest Guy", cursive;
      font-weight: 400;
      font-style: normal;
    }

    .font-damion {
      font-family: "Damion", cursive;
      font-weight: 400;
      font-style: normal;
    }

    .font-ubik-wet-paint {
      font-family: "Rubik Wet Paint", system-ui;
      font-weight: 400;
      font-style: normal;
    }

    .font-poetsen-one {
      font-family: "Poetsen One", sans-serif;
      font-weight: 400;
      font-style: normal;
    }

    .font-crafty-girls {
      font-family: "Crafty Girls", cursive;
      font-weight: 400;
      font-style: normal;
    }

    .font-orbitron {
      font-family: "Orbitron", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
    }

    .font-press-start-2p {
      font-family: "Press Start 2P", system-ui;
      font-weight: 400;
      font-style: normal;
    }

    .font-monoton {
      font-family: "Monoton", sans-serif;
      font-weight: 400;
      font-style: normal;
    }

    .font-syncopate {
      font-family: "Syncopate", sans-serif;
      font-weight: 400;
      font-style: normal;
    }

    .font-pacifico {
      font-family: "Pacifico", cursive;
      font-weight: 400;
      font-style: normal;
    }

    .font-dynapuff {
      font-family: "DynaPuff", system-ui;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
      font-variation-settings:
        "wdth" 100;
    }

    .font-fascinate {
      font-family: "Fascinate", system-ui;
      font-weight: 400;
      font-style: normal;
    }

    .font-limelight {
      font-family: "Limelight", sans-serif;
      font-weight: 400;
      font-style: normal;
    }

    h3 {
      margin-bottom: 20px;
    }

    .page-layout {
      display: flex;
      align-items: flex-start;
      gap: 40px;
    }

    .heading {
      font-weight: bold;
      color: #fc8911;
    }

    form {
      flex: 1;
      max-width: 560px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.08);
    }

    fieldset {
      border: none;
      margin-bottom: 20px;
      padding: 0;
    }

    legend {
      font-weight: 600;
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin-bottom: 12px;
    }

    label small {
      display: block;
      margin-top: 4px;
      font-size: 0.8em;
      color: #555;
    }

    label {
      display: block;
      font-size: 0.9em;         /* Smaller text */
      font-weight: 500;         /* Slightly lighter */
      margin-bottom: 4px;       /* Space below label */
      color: #444;              /* Optional: soften color */
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      margin-bottom: 16px;
    }

    input[type="color"],
    input[type="number"],
    select {
      margin-top: 6px;
    }

    .preview-box {
      flex: 1;
      max-width: 600px;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      color: white;
      box-shadow: 0 0 8px rgba(0,0,0,0.2);
    }

    .sorter-overlay-details-box {
      flex: 1;
      max-width: 600px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.08);
    }

    .preview-box h4, .sorter-overlay-details-box h4 {
      margin-bottom: 12px;
    }

    iframe {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 8px;
    }

    /* Inline field groups */
    .inline-group {
      display: flex;
      gap: 5px 10px;
      flex-wrap: wrap;
    }

    .inline-group label {
      flex: 1;
      margin-bottom: 0;
    }
    .inline-group input[type="number"] {
      width: 75px;
      height: 20px;
      margin-top: 3px;
    }

    input[type="color"] {
      width: 85px;
      appearance: none;
      border: none;
      padding: 0;
      height: 32px;
      background: none;
      cursor: pointer;
    }

    legend {
      color: #fc8911;
      padding-inline: 0px;
    }

    .smallText {
      font-size: 12px;
    }

    label.inline-label {
      margin-top: 5px;
      width: 100px;
    }

    label.with-small-headers {
      margin-top: 22px;
    }

    .padding-fields input {
      margin-top: 0px;
    }

    .example-div {
      min-height: 55px;
      width: 100%;
    }

    select {
      height: 26px;
      margin-top: 3px;
      padding-inline:2px;
    }

    select#fontSelect {
      width: 178px;
    }

    .preview-wrapper {
      flex: 1;
      max-width: 640px;
      width: 640px;
      display: flex;
      flex-direction: column;
      gap: 40px; /* Add spacing between preview and details */
    }

    button#copyUrlButton {
      margin-top: 0px;
    }

    code#sorter-overlay-url {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h3>Setup how the sorter overlay look, and customise to your style</h3>
  <div class="page-layout">
    <form id="sorterOverlaySettingsForm" onsubmit="return false;">
      <fieldset>
        <legend>Text</legend>
        <div class="inline-group">
          <div>
            <label class="inline-label with-small-headers">Font:</label>
          </div>
          <div>
            <div class="smallText">Family</div>
            <select name="font" id="fontSelect">
              <option value="Abril Fatface">Abril Fatface</option>
              <option value="Alfa Slab One">Alfa Slab One</option>
              <option value="Bangers">Bangers</option>
              <option value="Barriecito">Barriecito</option>
              <option value="Bebas Neue">Bebas Neue</option>
              <option value="Crafty Girls">Crafty Girls</option>
              <option value="Damion">Damion</option>
              <option value="DynaPuff">DynaPuff</option>
              <option value="Fascinate">Fascinate</option>
              <option value="Inter">Inter</option>
              <option value="Limelight">Limelight</option>
              <option value="Lobster">Lobster</option>
              <option value="Luckiest Guy">Luckiest Guy</option>
              <option value="Merriweather">Merriweather</option>
              <option value="Monoton">Monoton</option>
              <option value="Open Sans">Open Sans</option>
              <option value="Orbitron">Orbitron</option>
              <option value="Pacifico">Pacifico</option>
              <option value="Playfair Display">Playfair Display</option>
              <option value="Poetsen One">Poetsen One</option>
              <option value="Press Start 2P">Press Start 2P</option>
              <option value="Roboto">Roboto</option>
              <option value="Rubik Wet Paint">Rubik Wet Paint</option>
              <option value="Syncopate">Syncopate</option>
              <option value="Ubuntu">Ubuntu</option>
            </select>
          </div>
          <div>
            <div class="smallText">Size (px)</div>
            <input type="number" name="fontSize" id="fontSize" />
          </div>
          <div>
            <div class="smallText">Weight</div>
            <select name="fontWeight" id="weightSelect">
              <option value="100">Thin</option>
              <option value="200">Extra Light</option>
              <option value="300">Light</option>
              <option value="400">Normal</option>
              <option value="500">Medium</option>
              <option value="600">Semi Bold</option>
              <option value="700">Bold</option>
              <option value="800">Extra Bold</option>
            </select>
          </div>
        </div>
        <div class="inline-group padding-fields ">
          <div>
            <label class="inline-label with-small-headers">Outline:</label>
          </div>
          <div>
            <div class="smallText">Color</div>
            <input type="color" name="outlineColor" />
          </div>
          <div>
            <div class="smallText">Width (px)</div>
            <input type="number" name="outlineWidth" size="3" />
          </div>
        </div>
        <div class="inline-group example-div">
          <div>
            <label class="inline-label">Example:</label>
          </div>
          <div>
            <div id="fontPreview">Sample Text</div>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Image</legend>
        <div class="inline-group padding-fields">
          <div>
            <label class="inline-label with-small-headers">Dimensions:</label>
          </div>
          <div>
            <div class="smallText">Height (px)</div>
            <input type="number" name="imageHeight" size="4" />
          </div>
          <div>
            <div class="smallText">Width (px)</div>
            <input type="number" name="imageWidth" size="4" />
          </div>
        </div>
        <div class="inline-group padding-fields">
          <div>
            <label class="inline-label with-small-headers">Padding:</label>
          </div>
          <div>
            <div class="smallText">Top (px)</div>
            <input type="number" name="paddingTop" size="3" />
          </div>
          <div>
            <div class="smallText">Bottom (px)</div>
            <input type="number" name="paddingBottom" size="3" />
          </div>
        </div>
      </fieldset>

        <label>Custom CSS:
          <textarea name="customCSS" rows="6"></textarea>
        </label>

      <button type="submit">Save Settings</button>
      <button type="button" id="resetSettings" style="margin-left: 10px; background: #ccc;">Restore Default Settings</button>
    </form>
    <div class="preview-wrapper">
      <div class="preview-box">
        <div class="heading">Live Overlay Preview</div>
        <iframe id="sorterOverlayPreviewFrame" style="width: 100%; height: 412px; border: none; border-radius: 8px;"></iframe>
      </div>
      <div class="sorter-overlay-details-box">
        <div class="heading">Your OBS Overlay URL</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <code id="sorter-overlay-url"></code>
          <button id="copyUrlButton">Copy</button>
        </div>
      </div>
    </div>
  </div>
  <div id="toast" style="
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 0.95em;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 9999;
    pointer-events: none;
  "></div>
</body>
</html>
