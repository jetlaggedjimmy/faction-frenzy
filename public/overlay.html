    .font-dynapuff {

        "wdth" 100;
    }

    .font-fascinate {
      font-family: "Fascinate", system-ui;
      font-weight: 400;
      font-style: normal;
    }

    .font-limelight {
      font-family: "Limelight", sans-serif;
      font-weight: 400;
      font-style: normal;
    }

    #overlay-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      gap: 10px;
    }


    .crest-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 300px;
      height: 300px;
      position: relative;
      padding: 10px;
    }

    .welcome-line {
      font-size: 2.2em;
      color: #ffffff;
      text-align: center;
      transition: opacity 0.6s ease, transform 0.6s ease;
      opacity: 1;
      margin: 0;
    }

    .slot-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .welcome-line.show {
      opacity: 1;
      transform: translateY(0);
    }

    .crest {
      width: 100%;
      height: auto;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: scale(0.8);
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.8));
    }

    .crest.show {
      opacity: 1;
      transform: scale(1);
    }

    .slot {
      display: flex;
      overflow: hidden;
      position: relative;
      margin: 0 auto; /* Centers horizontally */
      justify-content: center; /* Aligns images */
      align-items: center;
    }

    .slot-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      position: absolute;
      transition: transform 2s ease-in-out;
      opacity: 0; /* Start hidden */
    }

    .fading-out {
      opacity: 0 !important;
      transform: translateY(30px); /* keep the same Y offset */
    }

    .slot-image {
      z-index: 2;
    }
    #particle-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0; /* Behind everything */
    }
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffeaa7;
      opacity: 0.8;
      animation: floatUp 4s linear forwards;
      filter: blur(0.5px);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) scale(0.5);
        opacity: 0;
      }
    }
  </style>

    <div id="welcomeHouse" class="welcome-line"></div>

    <!-- Slot Machine -->

      <div id="particle-layer"></div>
      <div class="slot">
        <!-- Images will be dynamically added here -->
      </div>
    </div>

    <div id="usernameTag" class="welcome-line"></div>
