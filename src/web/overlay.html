<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Faction Frenzy — Sorter Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alfa+Slab+One&family=Bangers&family=Barriecito&family=Bebas+Neue&family=Crafty+Girls&family=Damion&family=DynaPuff&family=Fascinate&family=Inter:wght@400;600;800&family=Limelight&family=Lobster&family=Luckiest+Guy&family=Merriweather&family=Monoton&family=Open+Sans&family=Orbitron&family=Pacifico&family=Playfair+Display&family=Poetsen+One&family=Press+Start+2P&family=Roboto&family=Rubik+Wet+Paint&family=Syncopate&family=Ubuntu&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Inter", sans-serif;
    }
    #stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #stage.visible { opacity: 1; }
    #welcome, #username {
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }
    #slot {
      object-fit: contain;
      transition: transform 0.15s ease;
    }
    #slot.landed { animation: landed 0.5s ease; }
    @keyframes landed {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: float var(--duration) linear forwards;
      opacity: 0.9;
    }
    @keyframes float {
      from { transform: translateY(0) rotate(0deg); opacity: 0.9; }
      to { transform: translateY(-110vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="welcome"></div>
    <img id="slot" src="" alt="" />
    <div id="username"></div>
  </div>
  <script type="module" src="./src/overlay.ts"></script>
</body>
</html>
