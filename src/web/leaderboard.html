<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Faction Frenzy — Leaderboard Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alfa+Slab+One&family=Bangers&family=Barriecito&family=Bebas+Neue&family=Crafty+Girls&family=Damion&family=DynaPuff&family=Fascinate&family=Inter:wght@400;600;800&family=Limelight&family=Lobster&family=Luckiest+Guy&family=Merriweather&family=Monoton&family=Open+Sans&family=Orbitron&family=Pacifico&family=Playfair+Display&family=Poetsen+One&family=Press+Start+2P&family=Roboto&family=Rubik+Wet+Paint&family=Syncopate&family=Ubuntu&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Inter", sans-serif;
    }
    /* The board fills the OBS browser source; rows share the space evenly */
    #board {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
    }
    #board.horizontal { flex-direction: row; }
    .frow {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 12px;
      border-radius: 4px;
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      transition: transform 0.6s ease;
      will-change: transform;
    }
    .frow img { height: 100%; width: auto; max-width: 40%; object-fit: contain; }
    .frow .fname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .frow .fpts { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .frow.bump { animation: bump 0.8s ease; }
    @keyframes bump {
      0% { transform: scale(1); }
      35% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    /* Ticker: an endlessly scrolling track containing copies of the board */
    #board.ticker {
      display: block;
      padding: 8px 0;
      overflow: hidden;
    }
    .track {
      display: flex;
      height: 100%;
      width: max-content;
      animation: marquee linear infinite;
    }
    .track .half { display: flex; gap: 8px; padding-right: 8px; height: 100%; }
    #board.ticker .frow { flex: 0 0 auto; width: max-content; height: 100%; }
    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    /* Reserved slot between name and total; "+N" fades in without resizing the row */
    .delta {
      min-width: 2.8em;
      text-align: center;
      font-weight: 800;
      white-space: nowrap;
      opacity: 0;
    }
    .delta.show { animation: deltaPop 1.8s ease-out forwards; }
    @keyframes deltaPop {
      0% { opacity: 0; transform: scale(0.6); }
      15% { opacity: 1; transform: scale(1.15); }
      75% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="board"></div>
  <script type="module" src="./src/leaderboard.ts"></script>
</body>
</html>
